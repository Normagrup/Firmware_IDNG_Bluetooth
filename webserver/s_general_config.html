<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDNG-Nordic Network Configuration</title>
    <link rel="stylesheet" href="assets/css/s_general_config.css">
</head>

<body>
	<div class="background-container">
        <img src="images/background.png">
    </div>

    <div class="popup-overlay" id="popupOverlay"></div>
    <div class="popup" id="popup">
        <div class="popup-container">
            <div class="popup-subcontainer">
                <label id="confirmDeleteData" style="margin-top: 10px; color: #4682b4;"> Do you want to delete ALL the data? </label>
                <label id="warnDeleteData" style="margin-top: 10px; color: #C30101; font-size: 13px;"> The network will be erased and the data cannot be recovered. </label>
                <input type="text" id="deleteConfirmInput" placeholder="Type DELETE to confirm" autocomplete="off">
                <div class="popup-button-subcontainer">
                    <button id="deletingDataButton" onclick="parent.clearAllData()" disabled> Confirm </button>
                </div>
            </div>
            
            <div class="popup-subcontainer-small">
                <span id="closeClearAllPopup" class="closeWindow" onclick="parent.closeManageDataPopup()"> &times; </span>
            </div>
        </div>
    </div>
    <div class="popup" id="popupLineScanning">
        <div class="popup-container">
            <div class="popup-subcontainer">
                <label id="lineScanningLabel" style="margin-top: 10px; color: #4682b4;"> Line Scanning in progress... </label>
                <div class="loader"></div>

                <div style="display: flex; align-items: center; gap: 10px;">
                    <label class="informer" id="informerLabel1" style="color: #000;"></label>
                    <button id="stopButton1" onclick="parent.stopLS(1)">Stop</button>
                </div>

                <label class="informer" id="informerTotal" style="color: #000;"> </label>

                <div style="display: flex; align-items: center; gap: 10px;">
                    <label class="informer" id="informerLabel2" style="color: #000;"></label>
                    <button id="stopButton2" onclick="parent.stopLS(2)">Stop</button>
                </div>
            </div>
        </div>
    </div>
    <div class="popup" id="popupEditInstallKey" style="width: 50%; height: 40%;">
        <div class="popup-container">
            <div class="popup-subcontainer">
                <label id="editInstallKeyLabel" style="margin-top: 10px; color: #4682b4;"> Set the Installation Key you want to use for the Bluetooth network </label>
                <div id="installKeyInputsContainer" style="display: flex; gap: 5px; margin-top: 15px;">
                    <input type="text" id="installKeyByte0" maxlength="2" style="width: 50px; text-align: center;" />
                    <input type="text" id="installKeyByte1" maxlength="2" style="width: 50px; text-align: center;" />
                    <input type="text" id="installKeyByte2" maxlength="2" style="width: 50px; text-align: center;" />
                    <input type="text" id="installKeyByte3" maxlength="2" style="width: 50px; text-align: center;" />
                    <input type="text" id="installKeyByte4" maxlength="2" style="width: 50px; text-align: center;" />
                    <input type="text" id="installKeyByte5" maxlength="2" style="width: 50px; text-align: center;" />
                    <input type="text" id="installKeyByte6" maxlength="2" style="width: 50px; text-align: center;" />
                    <input type="text" id="installKeyByte7" maxlength="2" style="width: 50px; text-align: center;" />
                    <input type="text" id="installKeyByte8" maxlength="2" style="width: 50px; text-align: center;" />
                    <input type="text" id="installKeyByte9" maxlength="2" style="width: 50px; text-align: center;" />
                    <input type="text" id="installKeyByte10" maxlength="2" style="width: 50px; text-align: center;" />
                    <input type="text" id="installKeyByte11" maxlength="2" style="width: 50px; text-align: center;" />
                    <input type="text" id="installKeyByte12" maxlength="2" style="width: 50px; text-align: center;" />
                    <input type="text" id="installKeyByte13" maxlength="2" style="width: 50px; text-align: center;" />
                    <input type="text" id="installKeyByte14" maxlength="2" style="width: 50px; text-align: center;" />
                    <input type="text" id="installKeyByte15" maxlength="2" style="width: 50px; text-align: center;" />
                </div>
                <label id="editInstallKeyAdv" style="margin-top: 10px; color: #C30101; font-size: 14px;"> Store the Installation Key safely, once rebooted it cannot be recovered </label>
                <div style="display: flex; gap: 10px; margin-top: 0px; justify-content: center;">
                    <button onclick="parent.clearCustomInstallKey()">Clear</button>
                    <button onclick="parent.randomizeInstallKey()">Randomize</button>
                    <button onclick="parent.copyInstallKey()">Copy</button>
                    <button onclick="parent.saveCustomInstallKey()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <div class="wrap-container">
        <div class="general-config-container">
            <div class="top-section">
                <h2> General Configuration </h2>

                <div class="antenna-installkey-container">
                    <div class="antenna-installkey-inputs">
                        <div class="input-group">
                            <label for="antennaID" style="color: #4682b4;"><b>Antenna ID</b></label>
                            <input type="number" id="antennaID" min="1" max="1000" oninput="parent.checkAntennaIDChange()">
                        </div>
                        <div class="input-group">
                            <label for="installKey" style="color: #4682b4;"><b>Installation Key</b></label>
                            <div style="display: flex; align-items: center; gap: 8px; width: 100%;">
                                <select id="installKey" class="selector" onchange="parent.updateButtonsForInstallKeySelected()">
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                    <option value="6">6</option>
                                    <option value="7">7</option>
                                    <option value="8">8</option>
                                    <option value="9">9</option>
                                    <option value="10">10</option>
                                    <option value="11">11</option>
                                    <option value="12">12</option>
                                    <option value="13">13</option>
                                    <option value="14">14</option>
                                    <option value="15">15</option>
                                    <option value="16">Custom</option>
                                </select>
                                <button id="editInstallKey" onclick="parent.editInstallKey()">
                                    <img id="editInstallKeyImg" src="images/edit.png" alt="Edit" style="width: 25px; height: 25px; padding-left: 1px;">
                                </button>
                            </div>
                        </div>
                    </div>
                    <button id="saveAntennaIDAndInstallKey" onclick="parent.setAntennaNumberAndInstallKey()" disabled>
                        <img src="images/save.png" alt="Save" style="width: 25px; height: 25px;">
                    </button>
                </div>

                <div class="antenna-installkey-container" style="display: flex; align-items: center; justify-content: center; margin-top: 15px; gap: 10px;">                    
                    <div style="display: flex; align-items: center; gap: 5px;">
                        <span style="color: #4682b4;">FROM</span>
                        <input type="number" id="scanStart" value="1" class="input-scan" min="1" max="2048">
                    </div>

                    <div style="display: flex; align-items: center; gap: 5px;">
                        <span style="color: #4682b4;">TO</span>
                        <input type="number" id="scanEnd" value="2048" class="input-scan" min="1" max="2048">
                    </div>

                    <button onclick="parent.lineScanning()" style="width: 40%; padding: 5px; margin-top: 0px;">Line Scan</button>
                </div>

                <div class="antenna-installkey-container" style="display: flex; align-items: center; justify-content: center; margin-top: 15px; gap: 10px;">
                    <label for="failComCycles" style="color: #4682b4;">FailCom Cycles:</label>
                    <input type="number" id="failComCycles" style="width: 80px; padding: 5px; padding-left: 10px;" min="1">
                    <button id="saveCycles" onclick="parent.saveCycles()">
                        <img src="images/save.png" alt="Save" style="width: 25px; height: 25px;">
                    </button>
                </div>

                <div class="antenna-installkey-container" style="display: flex; align-items: center; justify-content: center; margin-top: 15px; gap: 10px; visibility: hidden;">
                    <label for="activeKey" style="color: #4682b4;">Active Key:</label>
                    <select id="activeKey" class="selector2">
                        <option value="0">AppKey</option>
                        <option value="1">InstallKey</option>
                    </select>
                    <button id="saveKey" onclick="parent.saveActiveKey()">
                        <img src="images/save.png" alt="Save" style="width: 25px; height: 25px;">
                    </button>
                    <div class="vertical-separator"></div>
                    <div class="force-container">
                        <label style="font-size: 14px;" id="forceLabel"> Force </label>
                        <div class="switch-container">
                            <label class="switch">
                                <input type="checkbox" onchange="parent.switchForce()" id="toggleForce">
                                <span class="slider round"></span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
            <button class="clear-bottom-button" onclick="parent.clearAllDataPrev()"> Clear All Data </button>
        </div>
    </div>

    <script>
        window.onload = function () {
            const input = document.getElementById('deleteConfirmInput');
            const button = document.getElementById('deletingDataButton');

            const popupHeader = document.getElementById('confirmDeleteData');

            if (input && button) {
                input.addEventListener('input', function () {
                    const text = input.value.trim().toUpperCase();
                    const header = popupHeader.textContent;
                    button.disabled = (text !== "DELETE") || (header !== "Do you want to delete ALL the data?");
                });

                // Reiniciar botón por si ya estaba abierto antes
                input.value = "";
                button.disabled = true;
            }

            setTimeout(function () {
                parent.sendData("GET_FAILCOM_CYCLES", "");
                parent.sendData("GET_INSTALL_KEY", "");
                parent.sendData("GET_MASTER_REAL_ADDRESS", "");
                parent.sendData("GET_ACTIVE_KEY_AND_FORCE");
            }, 10);
        };
    </script>
</body>

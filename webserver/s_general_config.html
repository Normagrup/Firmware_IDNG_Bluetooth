<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDNG-Nordic Network Configuration</title>
    <link rel="stylesheet" href="assets/css/s_general_config.css">
</head>

<body>
	<div class="background-container">
        <img src="images/background.png">
    </div>

    <div class="popup-overlay" id="popupOverlay"></div>
    <div class="popup" id="popup">
        <div class="popup-container">
            <div class="popup-subcontainer">
                <label id="confirmDeleteData" style="margin-top: 10px; color: #4682b4;"> Do you want to delete ALL the data? </label>
                <label id="warnDeleteData" style="margin-top: 10px; color: #C30101; font-size: 13px;"> The network will be erased and the data cannot be recovered. </label>
                <input type="text" id="deleteConfirmInput" placeholder="Type DELETE to confirm">
                <div class="popup-button-subcontainer">
                    <button id="deletingDataButton" onclick="parent.clearAllData()" disabled> Confirm </button>
                </div>
            </div>
            
            <div class="popup-subcontainer-small">
                <span class="closeWindow" onclick="parent.closeManageDataPopup()"> &times; </span>
            </div>
        </div>
    </div>
    <div class="popup" id="popupLineScanning">
        <div class="popup-container">
            <div class="popup-subcontainer">
                <label id="lineScanningLabel" style="margin-top: 10px; color: #4682b4;"> Line Scanning in progress... </label>
                <div class="loader"></div>
                <label class="informer" id="informerLabel1" style="color: #000;"> </label>
                <label class="informer" id="informerTotal" style="color: #000;"> </label>
                <label class="informer" id="informerLabel2" style="color: #000;"> </label>
            </div>
        </div>
    </div>
    <div class="popup" id="popupChangeNetKey" style="width: 50%; height: 40%;">
        <div class="popup-container">
            <div class="popup-subcontainer">
                <label id="changeNetKeyLabel" style="margin-top: 10px; color: #4682b4;"> Set the NetKey you want to use for the Bluetooth network </label>
                <div id="netKeyInputsContainer" style="display: flex; gap: 5px; margin-top: 15px;">
                    <input type="text" id="netKeyByte0" maxlength="2" style="width: 50px; text-align: center;" />
                    <input type="text" id="netKeyByte1" maxlength="2" style="width: 50px; text-align: center;" />
                    <input type="text" id="netKeyByte2" maxlength="2" style="width: 50px; text-align: center;" />
                    <input type="text" id="netKeyByte3" maxlength="2" style="width: 50px; text-align: center;" />
                    <input type="text" id="netKeyByte4" maxlength="2" style="width: 50px; text-align: center;" />
                    <input type="text" id="netKeyByte5" maxlength="2" style="width: 50px; text-align: center;" />
                    <input type="text" id="netKeyByte6" maxlength="2" style="width: 50px; text-align: center;" />
                    <input type="text" id="netKeyByte7" maxlength="2" style="width: 50px; text-align: center;" />
                    <input type="text" id="netKeyByte8" maxlength="2" style="width: 50px; text-align: center;" />
                    <input type="text" id="netKeyByte9" maxlength="2" style="width: 50px; text-align: center;" />
                    <input type="text" id="netKeyByte10" maxlength="2" style="width: 50px; text-align: center;" />
                    <input type="text" id="netKeyByte11" maxlength="2" style="width: 50px; text-align: center;" />
                    <input type="text" id="netKeyByte12" maxlength="2" style="width: 50px; text-align: center;" />
                    <input type="text" id="netKeyByte13" maxlength="2" style="width: 50px; text-align: center;" />
                    <input type="text" id="netKeyByte14" maxlength="2" style="width: 50px; text-align: center;" />
                    <input type="text" id="netKeyByte15" maxlength="2" style="width: 50px; text-align: center;" />
                </div>
                <label id="changeNetKeyAdv" style="margin-top: 10px; color: #C30101; font-size: 14px;"> Store the NetKey safely, once set it cannot be recovered </label>
                <div style="display: flex; gap: 10px; margin-top: 0px; justify-content: center;">
                    <button onclick="parent.closeCustomNetKey()">Close</button>
                    <button onclick="parent.randomizeNetKey()">Randomize</button>
                    <button onclick="parent.changeCustomNetKey()">Apply</button>
                </div>
            </div>
        </div>
    </div>

    <div class="wrap-container">
        <div class="general-config-container">
            <div class="top-section">
                <h2> General Configuration </h2>
                <div style="display: flex; align-items: center; justify-content: center; margin-top: 15px; gap: 10px;">
                    <label for="antennaID" style="color: #4682b4;"><b>Antenna ID</b></label>
                    <input type="number" id="antennaID" style="width: 80px; padding: 5px; padding-left: 10px;" min="1" max="1000">
                    <button id="saveAntennaID" onclick="parent.setAntennaNumber()">
                        <img src="images/save.png" alt="Save" style="width: 25px; height: 25px;">
                    </button>
                </div>
                <div style="display: flex; align-items: center; justify-content: center; margin-top: 15px; gap: 10px; width: 100%;">
                    <select id="netKey" class="selector" onchange="parent.updateNetKeyButtons()">
                        <option value="1">NetKey 1</option>
                        <option value="2">NetKey 2</option>
                        <option value="3">NetKey 3</option>
                        <option value="4">NetKey 4</option>
                        <option value="5">NetKey 5</option>
                        <option value="6">NetKey 6</option>
                        <option value="7">NetKey 7</option>
                        <option value="8">NetKey 8</option>
                        <option value="9">NetKey 9</option>
                        <option value="10">NetKey 10</option>
                        <option value="11">NetKey 11</option>
                        <option value="12">NetKey 12</option>
                        <option value="13">NetKey 13</option>
                        <option value="14">NetKey 14</option>
                        <option value="15">NetKey 15</option>
                        <option value="16">Custom NetKey</option>
                    </select>
                    <button id="changeNetKey" onclick="parent.changeNetKey()">
                        <img id="changeNetKeyImg" src="images/save.png" alt="Change" style="width: 25px; height: 25px; padding-left: 1px;">
                    </button>
                </div>
                <button onclick="parent.lineScanning()"> Line Scanning </button>
                <div style="display: flex; align-items: center; justify-content: center; margin-top: 15px; gap: 10px;">
                    <label for="failComCycles" style="color: #4682b4;">FailCom Cycles:</label>
                    <input type="number" id="failComCycles" style="width: 80px; padding: 5px; padding-left: 10px;" min="1">
                    <button id="saveCycles" onclick="parent.saveCycles()">
                        <img src="images/save.png" alt="Save" style="width: 25px; height: 25px;">
                    </button>
                </div>
            </div>
            <button class="clear-bottom-button" onclick="parent.clearAllDataPrev()"> Clear All Data </button>
        </div>
    </div>

    <script>
        function isLineScanningInProgress() {
            setTimeout(function() {
				parent.sendData("SET_IS_LS_IN_PROGRESS", "");
			}, 10);
        }

        window.onload = function () {
            isLineScanningInProgress();

            const input = document.getElementById('deleteConfirmInput');
            const button = document.getElementById('deletingDataButton');

            if (input && button) {
                input.addEventListener('input', function () {
                    const text = input.value.trim().toUpperCase();
                    button.disabled = (text !== "DELETE");
                });

                // Reiniciar botón por si ya estaba abierto antes
                input.value = "";
                button.disabled = true;
            }

            setTimeout(function () {
                parent.sendData("GET_FAILCOM_CYCLES", "");
                parent.sendData("GET_NET_KEY", "");
                parent.sendData("GET_MASTER_REAL_ADDRESS", "");
            }, 10);
        };
    </script>
</body>

<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDNG-Nordic Network Configuration</title>
	<link rel="stylesheet" href="assets/css/nav-menu.css">
	<link rel="stylesheet" href="assets/css/login.css">
	<link rel="stylesheet" href="assets/css/own.css">
</head>

<body>
	<nav>
		<div class="wrapper">
			<div class="logo">
				<a href="http://www.normagrup.com/">
					<img src="images/normagrupWhite.png" alt="imageLogo"/>
				</a>
			</div>
			<div class="nav-center">
				<ul class="nav-links" id="menuContainer">
					<li id="summaryButton"><a onclick="loadPage('summary.html')"> Summary </a><div class="dot"></div></li>
				</ul>
			</div>
			<div class="nav-info-wrapper">
				<div class="nav-date-time" id="navDateTime">
					<span id="antennaDateTime"> </span>
				</div>
				<ul class="nav-links" id="loginContainer">
					<li id="loginButton"><a onclick="openLogin()"> Log in </a><div class="dot"></div></li>
				</ul>
			</div>
		</div>

		<div class="login-overlay" id="loginOverlay"></div>
		<div class="login" id="login">
			<span class="closeWindow" onclick="closeLoginPopup()"> &times; </span>
			<img src="images/normagrupNameBlue.png" alt="imageLogo"/>
			<input type="text" id="usernameInput" placeholder="Username">
			<input type="password" id="passwordInput" placeholder="Password">
			<label id="signError" style="color: #C30101; visibility: hidden;"><b>Username or password are incorrect!</b></label>
			<button onclick="sendLogin()"> Log in </button>
		</div>

		<div class="popup-overlay" id="popupOverlay"></div>
		<div class="popup" id="popup">
			<div class="popup-container">
				<div class="popup-subcontainer">
					<h2> It's necessary to configure the address of the Antenna </h2>
					<label id="intervalLabel" style="margin-top: 10px; color: #4682b4;"> Type an Antenna Number </label>
					<input type="number" id="antennaNumber" placeholder="Antenna Number" min="1" max="1000">
					<label id="intervalErrorLabel" style="margin-top: 10px; color: #C30101; visibility: hidden;"> It must be between 1 and 1000 </label>
					<div class="popup-button-subcontainer" id="confirmAddressContainer">
						<button id="antennaNumberButton" onclick="parent.setAntennaNumber()"> CONFIRM </button>
					</div>
				</div>
			</div>
		</div>
	</nav>

	<iframe id="mainframe" src="summary.html"></iframe>

	<script src="assets/js/index.js"></script>
	<script src="assets/js/websocket.js"></script>
	<script src="assets/js/aux_functions.js"></script>
	<script>
		var submask = 0;
	</script>

	<script>
		// HORA DE LA ANTENA 
		window.addEventListener("load", () => {
			// Esperar a que el WebSocket esté listo
			setTimeout(() => {
				if (typeof sendData === "function") {
					requestDateTime();
					requestDevicesAndFailuresCount();
					requestMasterRealAddress();
				}
			}, 1000);
		});
	</script>	

</body>

</html>

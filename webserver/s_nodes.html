<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDNG-Nordic Network Configuration</title>
    <link rel="stylesheet" href="assets/css/s_nodes.css">
</head>

<body>
	<div class="background-container">
        <img src="images/background.png">
    </div>

    <div class="popup-overlay" id="popupOverlay"></div>
    <div class="popupManageDevices2" id="popupDelDevice">
        <div class="popup-container">
            <div class="popup-subcontainer">
                <label id="deletingDeviceLabel" style="margin-top: 10px; color: #4682b4;"> Do you want to delete the node from the network? </label>
                <span id="warningDeleting" style="text-align: center; color: #C30101;">WARN: It's possible that some nodes will become out of communication</span>
                <div class="popup-button-subcontainer">
                    <button id="deletingDeviceButton" onclick="parent.delDevice()"> Confirm </button>
                </div>
            </div>
            
            <div class="popup-subcontainer-small">
                <span id="closeDelDevPopup" class="closeWindow" onclick="parent.closeWirelessPopup()"> &times; </span>
            </div>
        </div>
    </div>
    <div class="popupManageDevices2" id="popupDelAllDevices">
        <div class="popup-container">
            <div class="popup-subcontainer">
                <label id="deletingAllDevicesLabel" style="margin-top: 10px; color: #4682b4;"> Do you want to delete ALL the nodes from the network? </label>
                <div class="popup-button-subcontainer">
                    <button id="deletingAllDevicesButton" onclick="parent.delAllDevices()"> Confirm </button>
                </div>
            </div>
            
            <div class="popup-subcontainer-small">
                <span id="closeDelAllPopup" class="closeWindow" onclick="parent.closeWirelessPopup()"> &times; </span>
            </div>
        </div>
    </div>
    <div class="popupManual" id="popupRelay">
        <h2>Changing Relay...</h2>
        <br>
        <br>
        <div class="loader"></div>
    </div>

    <div class="wrap-container">
        <div class="wrap-list-container">
            <div class="title-container">
                <h2> Nodes Configuration </h2>
            </div>
            <div class="list-container">
                <div class="list">
                    <ul id="networkNodesList"></ul>
                    
                    <div class="under-button-container" id="manualContainerNetworkNodes">
                        <button onclick="parent.delDevicePrev()"> Remove device </button>
                        <button onclick="parent.delAllDevicesPrev()"> Remove all devices </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function getNodesFromDatabase() {
			setTimeout(function() {
				parent.sendData("SET_LOAD_NODES", "");
			}, 10);
		}
		
		window.onload = function() {
            getNodesFromDatabase();
        };

        document.addEventListener('click', function(event) {
            var popupOverlay = document.getElementById('popupOverlay');

            var networkNodesList = document.getElementById('networkNodesList');
            var networkDevices = networkNodesList.getElementsByTagName('li');

            if (event.target.tagName === 'BUTTON' || event.target.tagName === 'SELECT' || event.target.tagName === 'LI' || popupOverlay.style.visibility == "visible") { return; }

            for (var i = 0; i < networkDevices.length; i++) { networkDevices[i].classList.remove('selectedDevice'); }
        });
    </script>
</body>

</html>

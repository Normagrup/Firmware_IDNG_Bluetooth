<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDNG-Nordic Network Configuration</title>
    <link rel="stylesheet" href="assets/css/s_logs.css">
</head>

<body>
    <div class="background-container">
        <img src="images/background.png">
    </div>

    <div class="wrap-container">
        <div class="log-container" id="logControls">
            <h2> Log Results </h2>

            <div class="features-container">
                <label> Report type: </label>
                <select id="reportList" style="height: 50%; width: 40%; margin-left: 15px; margin-right: 18%;">
                    <option value="-"> ---- </option>
                    <option value="fail"> Fails report </option>
                    <option value="test"> Tests report </option>
                    <option value="all"> All </option>
                </select>
            </div>

            <div class="features-container" style="justify-content: space-between; margin-top: 40px;">
                <div class="field-container">
                    <img src="images/datePickerIcon.png" style="height: 50px; width: 50px; margin-top: 10px;">
                    <div class="date">
                        <label> Set initial date </label>
                        <input id="initialDatePicker" type="date">
                    </div>
                </div>
                <div class="field-container">
                    <img src="images/datePickerIcon.png" style="height: 50px; width: 50px; margin-top: 10px;">
                    <div class="date">
                        <label> Set final date </label>
                        <input id="finalDatePicker" type="date">
                    </div>
                </div>
            </div>

            <button onclick="parent.getLogs()" style="margin-top: 40px;"> Get logs </button>
            <label id="logError" style="margin-top: 10px; color: #C30101; visibility: hidden;"> Default </label>
            <button onclick="parent.showLogs()" style="margin-top: 10px;"> Show logs </button>
        </div>
        <div class="log-container" id="logsTableContainer" style="display:none; width: 95%; margin: 0px 0px;">
            <h2 id="logHeader2"> Log Results </h2>
            <div id="topBar">
                <div style="display: flex; justify-content: space-between; align-items: center; gap: 20px; width: 100%;">
                    <div style="display: flex; flex-direction: column;">
                        <label for="eventTypeFilter">Filter by Event Type:</label>
                        <select id="eventTypeFilter" onchange="parent.applyEventTypeFilter()">
                            <option value="All">All</option>
                            <option value="Device">Device</option>
                            <option value="Commissioning">Commissioning</option>
                            <option value="Test">Test</option>
                            <option value="Fail">Fail</option>
                        </select>
                    </div>
                    <div id="pageInfoLabel" style="font-weight: bold; margin-left: auto; margin-right: 0px;"></div>
                </div>
                <button class="log-button" id="backButton" onclick="parent.cancelShowLogs()">Back</button>
            </div>

            <table id="logsTable"> </table>
            <div style="display: flex; justify-content: center; gap: 20px; margin-top: 10px;">
                <button class="log-button" onclick="parent.prevLogPage()">Previous</button>
                <button class="log-button" onclick="parent.nextLogPage()">Next</button>
            </div>
        </div>
    </div>
</body>

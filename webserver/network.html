<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDNG-Nordic Network Configuration</title>
    <link rel="stylesheet" href="assets/css/network.css">
</head>

<body>
	<div class="background-container">
        <img src="images/background.png">
    </div>

    <div class="popup-overlay" id="popupOverlay"></div>
    <div class="popup" id="popup">
        <div class="popup-container">
            <div class="popup-subcontainer">
                <img id="deviceTypeIcon" src="images/defaultLightIcon.png" style="width: 30%; height: 40%;">
                <h3> HOLA </h3>
            </div>
            
            <div class="popup-subcontainer">
                <div class="popup-polling-subcontainer">
                    <button id="autonomyIcon" style="background-size: 90%; background-image: url('images/autonomyIcon.png');"></button>
                    <button id="batteryIcon" style="background-size: 80%; background-image: url('images/batteryIcon.png');"></button>
                    <button id="lampIcon" style="background-size: 90%; background-image: url('images/lampIcon.png');"></button>
                </div>
                
                <div class="popup-polling-subcontainer">
                    <button id="comIcon" style="background-size: 80%; background-image: url('images/comIcon.png');"></button>
                    <button id="emergencyIcon" style="background-size: 80%; background-image: url('images/emergencyIcon.png');"></button>
                    <button id="lvlIcon"></button>
                </div>
            </div>
            
            <div class="popup-subcontainer">
                <div class="popup-button-subcontainer">
                    <button onclick="parent.maxButton()" style="width: 32%;"> MAX </button>
                    <button onclick="parent.minButton()" style="width: 32%;"> MIN </button>
                    <button onclick="parent.offButton()" style="width: 32%;"> OFF </button>
                </div>
                
                <div class="popup-button-subcontainer">
                    <button onclick="parent.funcTestButton()" style="width: 32%;"> F Test </button>
                    <button onclick="parent.durTestButton()" style="width: 32%;"> D Test </button>
                    <button onclick="parent.stopButton()" style="width: 32%;"> STOP </button>
                </div>
                
                <div class="popup-button-subcontainer">
                    <input type="range" min="0" max="100" value="50" id="lvlSlider" onchange="parent.sliderInput()" style="width: 100%;">
                </div>
            </div>
            
            <div class="popup-subcontainer" style="border-right: none;">
                <div class="popup-button-subcontainer-2">
                    <button onclick="parent.identifyButton()"> IDENTIFY </button>
                    <br>
                    <button onclick="parent.stopIdentifyButton()"> STOP </button>
                </div>
            </div>
            
            <div class="popup-subcontainer-small">
                <span class="closeWindow" onclick="parent.closeNodeControl()"> &times; </span>
            </div>
        </div>
    </div>
    <div class="popupChangeNodes" id="popupChangeNodes">
        <h2> Swap positions </h2>
        <br>
        <div class="position-row">
            <label for="positionInput1">Position</label>
            <input id="positionInput1" type="number" min="1" max="2048" required>
        </div>
        <div class="position-row">
            <label for="positionInput2">Position</label>
            <input id="positionInput2" type="number" min="1" max="2048" required>
        </div>
        <div class="position-row">
            <button id="closeSwapButton" onclick="parent.closeSwap()">Cancel</button>
            <button id="confirmSwapButton" onclick="parent.confirmSwap()">Confirm</button>
        </div>
    </div>
    <div class="popupTree" id="popupTree">
        <h2> Loading tree... </h2>
        <br>
        <br>
        <div class="loader"></div>
    </div>

    <div class="wrap-container">
        <div class="wrap-network-container">
            <h2> Network Nodes </h2>
            <!-- Network Device Summary Section -->
            <div class="network-summary-container">
                <!-- Left Column (Total Devices & Failures) -->
                <div class="network-summary-left">
                    <p>Total Devices Configured: <span id="totalDevices">0</span></p>
                    <p>Total Failures: <span id="totalFailures">0</span></p>
                </div>

                <!-- Right Column (Failure Categories) -->
                <div class="network-summary-right">
                    <div class="failure-item">
                        <img id="comFailType" src="images/comIcon.png" alt="Communication Failure">
                        <span id="comFailCount">0</span>
                    </div>
                    <div class="failure-item">
                        <img id="DurFailType" src="images/autonomyIcon.png" alt="Battery Duration Failure">
                        <span id="DurFailCount">0</span>
                    </div>
                    <div class="failure-item">
                        <img id="BatFailType" src="images/batteryIcon.png" alt="Battery Failure">
                        <span id="BatFailCount">0</span>
                    </div>
                    <div class="failure-item">
                        <img id="LamFailType" src="images/lampIcon.png" alt="Lamp Failure">
                        <span id="LamFailCount">0</span>
                    </div>
                </div>
            </div>
            <div class="wrap-node-container">
                <div class="range-container">
                    <label style="margin: 0px 20px;"> Select node address range: </label>
                    <select id="addressList" title="Select range of address" onchange="parent.changeAddress()">
                        <option value="1"> Part 1: 1-64 </option>
                        <option value="2"> Part 2: 65-128 </option>
                        <option value="3"> Part 3: 129-192 </option>
                        <option value="4"> Part 4: 193-256 </option>
                        <option value="5"> Part 5: 257-320 </option>
                        <option value="6"> Part 6: 321-384 </option>
                        <option value="7"> Part 7: 385-448 </option>
                        <option value="8"> Part 8: 449-512 </option>
                        <option value="9"> Part 9: 513-576 </option>
                        <option value="10"> Part 10: 577-640 </option>
                        <option value="11"> Part 11: 641-704 </option>
                        <option value="12"> Part 12: 705-768 </option>
                        <option value="13"> Part 13: 769-832 </option>
                        <option value="14"> Part 14: 833-896 </option>
                        <option value="15"> Part 15: 897-960 </option>
                        <option value="16"> Part 16: 961-1024 </option>
                        <option value="17"> Part 17: 1025-1088 </option>
                        <option value="18"> Part 18: 1089-1152 </option>
                        <option value="19"> Part 19: 1153-1216 </option>
                        <option value="10"> Part 10: 1217-1280 </option>
                        <option value="21"> Part 21: 1281-1344 </option>
                        <option value="22"> Part 22: 1345-1408 </option>
                        <option value="23"> Part 23: 1409-1472 </option>
                        <option value="24"> Part 24: 1473-1536 </option>
                        <option value="25"> Part 25: 1537-1600 </option>
                        <option value="26"> Part 26: 1601-1664 </option>
                        <option value="27"> Part 27: 1665-1728 </option>
                        <option value="28"> Part 28: 1729-1792 </option>
                        <option value="29"> Part 29: 1793-1856 </option>
                        <option value="20"> Part 20: 1857-1920 </option>
                        <option value="31"> Part 31: 1921-1984 </option>
                        <option value="32"> Part 32: 1985-2048 </option>
                    </select>
                    <div class="tree-container">
                        <button id="changeNodes" onclick="parent.changeNodes()" style="margin-right: 5px;">
                            <img src="images/changeNodes.png" alt="ChangeNodes" class="button-icon">
                            Change nodes
                        </button>
                        <button id="showTree" onclick="parent.showTree()">
                            <img src="images/tree.png" alt="Tree" class="button-icon">
                            Show tree
                        </button>
                    </div>
                </div>
                <div class="node-container" id="node-container"></div>
            </div>
        </div>
        <div class="wrap-group-container">
            <h2> Network Groups </h2>
            <div class="range-container" style="justify-content: center;">
                <label> Pick some group </label>
            </div>
            <div class="group-container" id="group-container"></div>
        </div>
    </div>

    <script>
        window.onload = function() {
            parent.changeAddress();
            parent.createGroupButtons();

            setInterval(() => {
                parent.updateAllDisplayedButtons();
                parent.requestDevicesAndFailuresCount();
            }, 10000);

            function handleButtonClick(e) {
                var button = e.currentTarget;
                button.classList.add("clicked");
                setTimeout(function() {
                    button.classList.remove("clicked");
                }, 400);
            }

            document.querySelectorAll("button").forEach(function(btn) {
                btn.addEventListener("click", handleButtonClick);
            });
        };
    </script>
</body>

</html>
